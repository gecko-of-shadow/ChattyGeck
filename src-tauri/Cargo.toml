[package]
name = "zoochattr"
version = "0.7.3"
description = "ZooChattr: multi-channel Twitch chat with a gecko soul"
authors = ["gecko-of-shadow"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo issue #8519 on Windows).
name = "zoochattr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Update fingerprint (SHA-256) check; already in the build through other crates (Bran's OK, Q10 A).
sha2 = "0.10"

# Pinned to the copies Tauri 2.12.3 already locks. Windows-only: the context-menu filter.
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_System_Com"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
