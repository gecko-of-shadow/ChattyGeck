name: Release

# Builds the portable ZooChattr.exe on Windows. Pushing a tag like v0.1.0 publishes it as a GitHub Release;
# running it by hand (Actions tab > Release > Run workflow) just uploads the zip as a build artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm test

      - name: Build portable exe
        run: npm run build:portable
        env:
          # Public Twitch Client ID (Settings > Secrets and variables > Actions > Variables).
          # Without it the app still builds; people paste a Client ID in Settings to log in.
          TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID }}

      # The app's updater installs a zip only when its SHA-256 matches this file (src-tauri/src/update.rs).
      - name: Write SHA-256 fingerprint
        shell: pwsh
        run: |
          $zips = @(Get-ChildItem release/ZooChattr-portable-*.zip)
          if ($zips.Count -eq 0) { throw "No portable zip to fingerprint" }
          # The app only installs a version newer than itself, read from the zip name: tag and zip must agree.
          if ("${{ github.ref_type }}" -eq "tag") {
            $want = "ZooChattr-portable-$("${{ github.ref_name }}".TrimStart('v')).zip"
            if (-not ($zips | Where-Object Name -eq $want)) { throw "Tag ${{ github.ref_name }} but no $want (bump the version in package.json, Cargo.toml and tauri.conf.json)" }
          }
          foreach ($zip in $zips) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip.FullName).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText("$($zip.FullName).sha256", "$hash  $($zip.Name)`n")
            Write-Host "$hash  $($zip.Name)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ZooChattr-portable
          path: |
            release/ZooChattr-portable-*.zip
            release/ZooChattr-portable-*.zip.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # The fingerprint goes up with the zip, so no release ships without one.
          files: |
            release/ZooChattr-portable-*.zip
            release/ZooChattr-portable-*.zip.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
